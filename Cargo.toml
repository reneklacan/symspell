[package]
name = "symspell"
version = "0.5.2"
license = "MIT"
authors = ["Rene Klacan <rene.klacan@gmail.com>"]
keywords = ["spellcheck", "fuzzy-search", "spelling", "symspell", "autocorrect"]
categories = ["text-processing", "algorithms"]
description = "Spelling correction & Fuzzy search"
homepage = "https://github.com/reneklacan/symspell"
repository = "https://github.com/reneklacan/symspell"
exclude = ["data/*", ".*"]
rust-version = '1.85'
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strsim = "0.11.1"
derive_builder = "0.20.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unidecode = "0.3.0"

[target.wasm32-unknown-unknown.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3.79"
